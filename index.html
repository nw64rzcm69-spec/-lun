<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片轮播组件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .carousel-container {
            max-width: 900px;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .carousel {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
        }
        
        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }
        
        .carousel-item {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            color: white;
            padding: 30px 20px 20px;
            text-align: center;
        }
        
        .carousel-caption h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }
        
        .carousel-caption p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .carousel-control:hover {
            background-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-control.prev {
            left: 20px;
        }
        
        .carousel-control.next {
            right: 20px;
        }
        
        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background-color: white;
            transform: scale(1.2);
        }
        
        .carousel-title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .carousel-description {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .carousel {
                height: 400px;
            }
            
            .carousel-caption h3 {
                font-size: 1.4rem;
            }
            
            .carousel-caption p {
                font-size: 1rem;
            }
            
            .carousel-control {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .carousel {
                height: 300px;
            }
            
            .carousel-caption {
                padding: 20px 15px 15px;
            }
            
            .carousel-caption h3 {
                font-size: 1.2rem;
            }
            
            .carousel-caption p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="carousel-title">探索美丽世界</h1>
        
        <div class="carousel-container">
            <div class="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" scr="山脉风景">
                        <div class="carousel-caption">
                            <h3>壮丽山脉</h3>
                            <p>探索世界最高峰与最壮观的山脉景色</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1439066615861-d1af74d74000" scr="湖泊景色">
                        <div class="carousel-caption">
                            <h3>宁静湖泊</h3>
                            <p>清澈湖水倒映着蓝天白云，宁静而美丽</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1" scr="海滩风光">
                        <div class="carousel-caption">
                            <h3>金色海滩</h3>
                            <p>阳光、沙滩与海浪，享受悠闲的海滨时光</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" scr="森林景观">
                        <div class="carousel-caption">
                            <h3>神秘森林</h3>
                            <p>深入古老森林，感受大自然的生机与神秘</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" scr="北极光">
                        <div class="carousel-caption">
                            <h3>奇幻极光</h3>
                            <p>在夜空中舞动的彩色光带，大自然的奇迹</p>
                        </div>
                    </div>
                </div>
                
                <button class="carousel-control prev">&#10094;</button>
                <button class="carousel-control next">&#10095;</button>
                
                <div class="carousel-indicators">
                    <div class="indicator active"></div>
                    <div class="indicator"></div>
                    <div class="indicator"></div>
                    <div class="indicator"></div>
                    <div class="indicator"></div>
                </div>
            </div>
        </div>
        
        <p class="carousel-description">
            使用左右箭头或点击下方指示点浏览不同风景图片。轮播将自动切换，您也可以悬停在图片上暂停自动播放。
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const carouselInner = document.querySelector('.carousel-inner');
            const carouselItems = document.querySelectorAll('.carousel-item');
            const prevButton = document.querySelector('.carousel-control.prev');
            const nextButton = document.querySelector('.carousel-control.next');
            const indicators = document.querySelectorAll('.indicator');
            
            let currentIndex = 0;
            let autoPlayInterval;
            const totalItems = carouselItems.length;
            
            // 初始化轮播
            function initCarousel() {
                updateCarousel();
                startAutoPlay();
                
                // 添加事件监听器
                prevButton.addEventListener('click', showPrevSlide);
                nextButton.addEventListener('click', showNextSlide);
                
                indicators.forEach((indicator, index) => {
                    indicator.addEventListener('click', () => {
                        goToSlide(index);
                    });
                });
                
                // 鼠标悬停时暂停自动播放
                const carousel = document.querySelector('.carousel');
                carousel.addEventListener('mouseenter', pauseAutoPlay);
                carousel.addEventListener('mouseleave', startAutoPlay);
            }
            
            // 更新轮播显示
            function updateCarousel() {
                carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
                
                // 更新指示器
                indicators.forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === currentIndex);
                });
            }
            
            // 显示下一张幻灯片
            function showNextSlide() {
                currentIndex = (currentIndex + 1) % totalItems;
                updateCarousel();
            }
            
            // 显示上一张幻灯片
            function showPrevSlide() {
                currentIndex = (currentIndex - 1 + totalItems) % totalItems;
                updateCarousel();
            }
            
            // 跳转到指定幻灯片
            function goToSlide(index) {
                currentIndex = index;
                updateCarousel();
            }
            
            // 开始自动播放
            function startAutoPlay() {
                clearInterval(autoPlayInterval);
                autoPlayInterval = setInterval(showNextSlide, 4000);
            }
            
            // 暂停自动播放
            function pauseAutoPlay() {
                clearInterval(autoPlayInterval);
            }
            
            // 初始化轮播
            initCarousel();
        });
    </script>
</body>
</html>
